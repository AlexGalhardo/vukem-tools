name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions (Conventional Commits + SemVer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: commitlint
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: SemVer in package.json, and a tag matches it
        run: |
          root=$(jq -r .version package.json)
          echo "root=$root"
          [[ "$root" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then [ "${GITHUB_REF#refs/tags/v}" = "$root" ]; fi

  app:
    name: App (build, vet, golangci-lint, race tests, govulncheck)
    runs-on: ubuntu-latest
    # The schema tests run against real PostgreSQL, because that is what
    # production runs; on SQLite they would prove nothing about it.
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://pg:pg@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  assets:
    name: Assets (tsc, vite build, bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, stack-exhaustion DoS on deeply nested
      # glob patterns) has no fixed release: 3.0.3 is the latest published version.
      # It is reachable only through markdownlint-cli2 > globby > fast-glob >
      # micromatch > braces, a dev CLI we run over our own files, and braces is in
      # no shipped artifact. Drop the ignore as soon as braces publishes a fix.
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  markdown:
    name: Markdown (markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint:md

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vukem-tools:ci
      # The image runs with APP_ENV=production, where vukem requires a real mailer;
      # the smoke test only proves the binary links, boots and resolves its routes.
      - name: The binary starts and reports the app
        run: |
          docker run --rm             -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64 -w0)"             -e MAIL_MAILER=log             vukem-tools:ci about

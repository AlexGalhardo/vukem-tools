name: Release

# A vX.Y.Z tag tests, publishes the image, builds every desktop and CLI file and
# attaches them with checksums.txt to the GitHub release. A manual run builds the
# same files from any branch without a tag or a release: download them from the
# run's artifacts to test an installer before tagging.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the build, X.Y.Z (no tag is created)"
        required: true
        default: "0.0.0-dev"
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Version from the tag, or from the manual input
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::version must be X.Y.Z, got $version"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  test:
    name: Tests before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  # The image goes to GHCR and Docker Hub, is smoke tested before anything is
  # pushed, and is signed and attested afterwards. linux/amd64 only: the
  # yt-dlp binary in the Dockerfile is the x86-64 build.
  image:
    name: Image to GHCR and Docker Hub, signed
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/vukem-tools
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-tools
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # X.Y.Z, X.Y and latest only for a stable tag. A pre-release such as
      # v1.2.0-rc.1 gets its own exact tag and must never move latest.
      - name: Resolve the image tags
        id: meta
        run: |
          version="${TAG#v}"
          tags=("$GHCR_IMAGE:$version" "$HUB_IMAGE:$version")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              tags+=("$image:${version%.*}" "$image:latest")
            done
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Smoke build: loaded into the local daemon, never pushed. The push build
      # below reuses its layers through the GitHub cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smoke:vukem-tools
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e MAIL_MAILER=log \
            -e APP_ENV=development \
            smoke:vukem-tools about
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The same digest is in both registries, so each reference is signed.
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/vukem-tools
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-tools
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true


  # The CLI and every desktop target are cross-built with CGO_ENABLED=0. Linux and macOS use the
  # purego Wails backend so the build does not need GTK or WebKit headers.
  cli:
    name: CLI (windows/amd64, linux/amd64, linux/arm64, darwin/arm64)
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI for every target
        run: bash scripts/build-cli.sh "${{ needs.meta.outputs.version }}" dist
      - name: The Linux build runs
        run: dist/vukem-tools-cli-*-linux-amd64 tools >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-cli
          path: dist/vukem-tools-cli-*
          if-no-files-found: error

  desktop-windows:
    name: Windows installer and portable zip
    needs: [meta, test]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS 3.11.0
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the executable, the installer and the zip
        shell: bash
        run: bash scripts/build-windows.sh "${{ needs.meta.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  desktop-linux:
    name: Linux AppImage
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the desktop binary
        run: |
          set -euo pipefail
          mkdir -p out
          CGO_ENABLED=0 go build -tags purego -trimpath -ldflags "-s -w -X main.version=${{ needs.meta.outputs.version }}" -o out/vukem-tools ./cmd/desktop
      - name: Build the AppImage
        run: bash desktop/packaging/linux/build-appimage.sh out/vukem-tools "${{ needs.meta.outputs.version }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-linux
          path: dist/*.AppImage
          if-no-files-found: error

  desktop-macos:
    name: macOS disk image
    needs: [meta, test]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the desktop binary
        run: |
          set -euo pipefail
          mkdir -p out
          CGO_ENABLED=0 GOARCH=arm64 go build -tags purego -trimpath -ldflags "-s -w -X main.version=${{ needs.meta.outputs.version }}" -o out/vukem-tools ./cmd/desktop
      - name: Build the disk image
        run: bash desktop/packaging/macos/build-dmg.sh out/vukem-tools "${{ needs.meta.outputs.version }}" arm64 dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-macos
          path: dist/*.dmg
          if-no-files-found: error

  checksums:
    name: checksums.txt
    needs: [cli, desktop-windows, desktop-linux, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: files-*
          path: dist
          merge-multiple: true
      - run: bash scripts/checksums.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  # Only a tag publishes. The release is created here, after the image is
  # pushed, so a failed image never leaves a release behind.
  release:
    name: GitHub release
    needs: [image, checksums]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its files
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Extract the changelog section
        run: |
          version="${TAG#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 {p=1; next} p && index($0, "## [") == 1 {exit} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }
      - name: Create the release if it does not exist
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi
      - name: Attach every file and checksums.txt
        run: gh release upload "$TAG" dist/* --clobber

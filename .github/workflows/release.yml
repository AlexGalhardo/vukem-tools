name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests before anything is published
    runs-on: ubuntu-latest
    steps:
      - name: Only a version tag releases
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::run this workflow on a vX.Y.Z tag, not on $GITHUB_REF"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  # The image goes to GHCR and Docker Hub, is smoke tested before anything is
  # pushed, and is signed and attested afterwards. linux/amd64 only: the
  # yt-dlp binary in the Dockerfile is the x86-64 build.
  image:
    name: Image to GHCR and Docker Hub, signed
    needs: test
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/vukem-tools
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-tools
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # X.Y.Z, X.Y and latest only for a stable tag. A pre-release such as
      # v1.2.0-rc.1 gets its own exact tag and must never move latest.
      - name: Resolve the image tags
        id: meta
        run: |
          version="${TAG#v}"
          tags=("$GHCR_IMAGE:$version" "$HUB_IMAGE:$version")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              tags+=("$image:${version%.*}" "$image:latest")
            done
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Smoke build: loaded into the local daemon, never pushed. The push build
      # below reuses its layers through the GitHub cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smoke:vukem-tools
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e MAIL_MAILER=log \
            -e APP_ENV=development \
            smoke:vukem-tools about
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The same digest is in both registries, so each reference is signed.
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/vukem-tools
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-tools
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 {p=1; next} p && index($0, "## [") == 1 {exit} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          body_path: release-notes.md

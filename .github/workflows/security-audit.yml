name: Security audit

# Runs the vendored Cloudflare security-audit skill (.claude/skills/security-audit) on every
# pull request. The deterministic job always runs; the agent review needs the ANTHROPIC_API_KEY
# repository secret and is skipped (not failed) while that secret is absent.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    name: Security audit (skill validators, govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Skill is vendored and its validators pass
        run: |
          test -f .claude/skills/security-audit/SKILL.md
          node --test .claude/skills/security-audit/*.test.cjs
      - name: Known vulnerabilities in reachable code
        run: go tool govulncheck ./...

  agent:
    name: Security audit (agent review, guidance mode)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        if: env.ANTHROPIC_API_KEY != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the security-audit skill in .claude/skills/security-audit in guidance mode.
            Review only the changes in this pull request against ${{ github.event.pull_request.base.ref }}
            and post one review comment listing validated findings with file:line, or "no findings".

# Produção self-hosted (stack completa atrás do Caddy do host — ver setups/setup-unix-vps-docker.sh).
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Portas publicadas só em 127.0.0.1: o Caddy é o único ponto de entrada público.
# Configuração: backend/.env, frontend/.env.local e telegram/.env (ver os .env.example).
#
# Dimensionamento: ~250 MB em repouso; ffmpeg re-encodando 1080p pode passar de 600 MB.
# Mínimo realista: 2 vCPU / 2 GB RAM / 10 GB de disco.
name: galhardo-video

services:
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    image: galhardo-video-backend:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      FFMPEG_THREADS: "1"
    env_file:
      - path: ../backend/.env
        required: false
    volumes:
      - downloads:/app/downloads
    deploy:
      resources:
        limits:
          memory: 1536M

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    image: galhardo-video-frontend:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      API_BASE_URL: "http://backend:8000"
    env_file:
      - path: ../frontend/.env.local
        required: false
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  telegram:
    # Só sobe com --profile telegram (exige TELEGRAM_BOT_TOKEN em telegram/.env).
    profiles: ["telegram"]
    build:
      context: ..
      dockerfile: infra/docker/telegram.Dockerfile
    image: galhardo-video-telegram:prod
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://backend:8000"
    env_file:
      - path: ../telegram/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  downloads:

[project]
name = "galhardo-video-telegram"
version = "2.0.0"
description = "Bot do Telegram do Galhardo Video (download via chat)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle erros
    "W",   # pycodestyle avisos
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "W191", # indentação com tab é o padrão do projeto (.editorconfig)
    "E101", # docstrings alinham continuação de listas com espaços após o tab
    "UP045", # `Optional[X]` -> `X | None`: mesma convenção do backend
    "UP042", # `class X(str, Enum)` -> `StrEnum`: mesma justificativa do backend
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
